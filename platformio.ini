; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
# The product image includes both transports; the stored profile selects one.
# Legacy single-backend targets below remain available for controlled rollback.
default_envs = esp32s3_unified

[env:esp32s3]
platform = espressif32@6.13.0
board = sonicwave_esp32s3_n16r8
framework = arduino, espidf
monitor_speed = 115200
board_build.partitions = partitions/sonicwave_esp32s3_n16r8_ota_16mb.csv
# Arduino Core 2.0.17 is component-compatible with ESP-IDF 4.4 only.
# Keep this explicit so the bootloader configuration is reproducible.
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  platformio/framework-espidf@3.40407.240606
extra_scripts =
  pre:tools/release_identity_build_flags.py

lib_deps =
  4-20ma/ModbusMaster

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -Wno-error=uninitialized

# Formal legacy image. This keeps the existing MAX485/Modbus path available
# for internal maintenance and rollback.
[env:esp32s3_laser485]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DSW_DISTANCE_BACKEND_485=1

# Formal product image. The application source is shared with the 485 image;
# the compile-time backend switch prevents both transports from being active.
[env:esp32s3_cyd3s1612_iic]
extends = env:esp32s3
lib_deps =
build_flags =
  ${env:esp32s3.build_flags}
  -DSW_DISTANCE_BACKEND_CYD3S1612_IIC=1

# Unified product image. Both transports are compiled in; the persisted
# sensor_profile selects one backend. Base/NONE starts neither backend.
[env:esp32s3_unified]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DSW_DISTANCE_BACKEND_UNIFIED=1

# USB-maintenance-only bootchain baseline. This profile deliberately does not
# use release_identity_build_flags.py: it validates application rollback and
# USB CDC observability without embedding a release security version or
# enabling eFuse anti-rollback.
[env:esp32s3_rollback_usb_baseline]
extends = env:esp32s3
extra_scripts =
  pre:tools/test_bootchain_baseline_build_flags.py

# Test-only image: injects a deterministic first-boot self-check failure.
# This environment is never the default and is not a release target.
[env:esp32s3_rollback_self_check_fail]
extends = env:esp32s3_rollback_usb_baseline
build_flags =
  ${env:esp32s3_rollback_usb_baseline.build_flags}
  -DSW_OTA_ROLLBACK_TEST_INJECT_SELF_CHECK_FAILURE=1

[env:esp32_plus_laser_sim]
platform = espressif32
board = sonicwave_esp32s3_n16r8
framework = arduino
monitor_speed = 115200
build_src_filter =
  -<*>
  +<../test_firmware/esp32_plus_laser_sim/main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -D SW_LASER_SIM_FIRMWARE=1

# Hardware smoke test for CYD3S1612-IIC. This image only reads the sensor and
# prints results over USB serial; it does not start the production application.
[env:cyd3s1612_iic_test]
platform = espressif32@6.13.0
board = sonicwave_esp32s3_n16r8
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/sonicwave_esp32s3_n16r8_ota_16mb.csv
build_src_filter =
  -<*>
  +<../test_firmware/cyd3s1612_iic_test/main.cpp>
  +<modules/laser/Cyd3s1612I2cReader.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DSW_CYD3S1612_IIC_TEST=1

# USB-only pre-upgrade inventory/bridge image for existing Base/Plus devices.
# It never writes automatically and is not a product firmware or OTA target.
[env:e8_legacy_config_bridge]
platform = espressif32@6.13.0
board = sonicwave_esp32s3_n16r8
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/sonicwave_esp32s3_n16r8_ota_16mb.csv
build_src_filter =
  -<*>
  +<../test_firmware/e8_legacy_config_bridge/main.cpp>
  +<core/FirmwareDeviceIdentityProvider.cpp>
